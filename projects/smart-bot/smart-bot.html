<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نموذج التواصل الذكي</title>
  <link rel="stylesheet" href="smart-bot.css">
</head>

<body>

  <div class="form-card">
    <h2>أرسل لنا رسالتك</h2>
    <form id="contactForm">
      <div class="form-group">
        <label for="name">الاسم:</label>
        <input type="text" id="name" required placeholder="اكتب اسمك">
      </div>
      <div class="form-group">
        <label for="email">البريد الإلكتروني:</label>
        <input type="email" id="email" required placeholder="example@mail.com">
      </div>
      <div class="form-group">
        <label for="message">الرسالة:</label>
        <textarea id="message" rows="4" required placeholder="اكتب استفسارك هنا..."></textarea>
      </div>
      <button type="submit">إرسال الرسالة</button>
    </form>
    <p id="statusMessage"></p>
  </div>

  <script src="smart-bot.js"></script>
</body>

</html>
