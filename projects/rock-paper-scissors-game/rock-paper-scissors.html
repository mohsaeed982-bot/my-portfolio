<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="rock-paper-scissors.css">
  <title>Rock Paper Scissors Game</title>
</head>

<body>
  <p class="title">Rock Paper Scissors</p>

  <button onclick="gameResult('rock')" class="symbols-btn">
    <img src="emojies/rock-emoji.png" alt="Rock">
  </button>

  <button onclick="gameResult('paper')" class="symbols-btn">
    <img src="emojies/paper-emoji.png" alt="Paper">
  </button>

  <button onclick="gameResult('scissors') " class="symbols-btn">
    <img src="emojies/scissors-emoji.png" alt="Scissors">
  </button>

  <p class="js-pra1 result"></p>
  <p class="js-pra2 comparison"></p>
  <p class="js-pra3 score"></p>

  <button onclick="score = {
    wins: 0,
    losses: 0,
    Ties: 0
  }
    localStorage.removeItem('score')
    updateScore()
  " class="reset-btn">Reset Score</button>


  <script src="rock-paper-scissors.js"></script>
</body>

</html>
